[project]
name = "bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "gmsh>=4.15.0",
    "ipython>=9.10.0",
    "ferrispline",
    "panda3d>=1.10.16",
]

[tool.uv]
package = true

[tool.uv.sources]
ferrispline = { path = "ferrispline/python" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pdoc>=16.0.0",
    "pyqt5>=5.15.11",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyvista>=0.47.3",
    "ruff",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=html --cov-report=term"
testpaths = ["tests"]


